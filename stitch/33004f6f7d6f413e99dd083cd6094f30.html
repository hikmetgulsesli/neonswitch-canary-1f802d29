<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NeonSwitch Canary - Settings</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=JetBrains+Mono:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "tertiary-fixed": "#ffe17a",
                        "on-surface": "#e4e1e9",
                        "surface-variant": "#35343a",
                        "tertiary-container": "#ffd94b",
                        "primary": "#e3fdff",
                        "secondary-container": "#fe00fe",
                        "on-tertiary-fixed": "#231b00",
                        "surface-container-highest": "#35343a",
                        "on-error": "#690005",
                        "tertiary": "#fff8eb",
                        "error": "#ffb4ab",
                        "on-secondary-fixed": "#380038",
                        "on-secondary-container": "#500050",
                        "secondary-fixed": "#ffd7f5",
                        "primary-container": "#00f3ff",
                        "inverse-surface": "#e4e1e9",
                        "surface-dim": "#131318",
                        "primary-fixed-dim": "#00dce6",
                        "surface-container-lowest": "#0e0e13",
                        "on-error-container": "#ffdad6",
                        "on-primary-fixed": "#002022",
                        "on-primary-fixed-variant": "#004f53",
                        "secondary-fixed-dim": "#ffabf3",
                        "on-primary": "#00373a",
                        "inverse-primary": "#00696f",
                        "on-tertiary-container": "#735e00",
                        "error-container": "#93000a",
                        "on-tertiary-fixed-variant": "#554500",
                        "background": "#131318",
                        "secondary": "#ffabf3",
                        "inverse-on-surface": "#303036",
                        "outline": "#849495",
                        "on-background": "#e4e1e9",
                        "primary-fixed": "#6ff6ff",
                        "outline-variant": "#3a494b",
                        "on-primary-container": "#006b71",
                        "surface-container-low": "#1b1b20",
                        "tertiary-fixed-dim": "#ecc300",
                        "surface-bright": "#39383e",
                        "on-secondary-fixed-variant": "#810081",
                        "surface-container": "#1f1f25",
                        "on-tertiary": "#3b2f00",
                        "surface-container-high": "#2a292f",
                        "surface": "#131318",
                        "on-surface-variant": "#b9cacb",
                        "on-secondary": "#5b005b",
                        "surface-tint": "#00dce6"
                    },
                    borderRadius: {
                        DEFAULT: "0.25rem",
                        lg: "0.5rem",
                        xl: "0.75rem",
                        full: "9999px"
                    },
                    spacing: {
                        "margin-mobile": "16px",
                        "grid-columns": "12",
                        "margin-desktop": "48px",
                        "gutter": "16px",
                        "unit": "4px"
                    },
                    fontFamily: {
                        "headline-md": ["JetBrains Mono", "monospace"],
                        "mono-data": ["JetBrains Mono", "monospace"],
                        "headline-lg": ["JetBrains Mono", "monospace"],
                        "body-md": ["Inter", "sans-serif"],
                        "display-lg": ["JetBrains Mono", "monospace"],
                        "body-lg": ["Inter", "sans-serif"],
                        "label-caps": ["JetBrains Mono", "monospace"]
                    },
                    fontSize: {
                        "headline-md": ["24px", { lineHeight: "1.2", fontWeight: "700" }],
                        "mono-data": ["14px", { lineHeight: "1.4", fontWeight: "400" }],
                        "headline-lg": ["32px", { lineHeight: "1.2", letterSpacing: "0.05em", fontWeight: "700" }],
                        "body-md": ["16px", { lineHeight: "1.5", fontWeight: "400" }],
                        "display-lg": ["48px", { lineHeight: "1.1", letterSpacing: "-0.02em", fontWeight: "800" }],
                        "body-lg": ["18px", { lineHeight: "1.6", fontWeight: "400" }],
                        "label-caps": ["12px", { lineHeight: "1.4", letterSpacing: "0.1em", fontWeight: "600" }]
                    }
                }
            }
        }
    </script>
<style>
        /* Cyberpunk Custom Range Slider */
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 10px;
            background: #e3fdff; /* theme primary */
            cursor: pointer;
            border-radius: 0;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.6);
        }
        input[type=range]::-moz-range-thumb {
            height: 20px;
            width: 10px;
            background: #e3fdff;
            cursor: pointer;
            border-radius: 0;
            border: none;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.6);
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body-md antialiased min-h-screen relative overflow-hidden">
<!-- Faux Gameplay Background -->
<div class="absolute inset-0 z-0 bg-cover bg-center opacity-40 scale-105" data-alt="A high-speed, neon-drenched cyberpunk racing or reflex game environment. The scene is slightly motion-blurred, featuring glowing cyan and magenta geometric tracks against a deep black void. Bright data streams and neon HUD elements flash in the periphery. The overall lighting is dark but punctuated by intense, high-contrast neon light sources. The mood is fast-paced, digital, and electric." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCxjE56ESSX5pTJ-pLSzCwKaYW_fd9ryP1QYPZX4gslhfRBCrim9kDiHTvfXbFpKZ43bhn9zOyTfO84u8Yc5mCT-FY3ToRdo2kVSf1nX7QwWf1CenpSNtFRxu_iz3OaSnPJIWJRsy5ZZhn_oyI8ssDC6Tp1vRf4yHmMfJ0FcawjCZ_IL9tSZsclXcc2fS_ceAmTmf0Jgyj3KOI_boz8HgolDb4VxF29VNMOiDGUM6TBbT5B8fh6THxMNCHMonepdoKVxYiwudsJWUqN');"></div>
<!-- Dark Overlay / Vignette -->
<div class="absolute inset-0 z-0 bg-gradient-to-t from-background via-background/80 to-background/50"></div>
<!-- Modal Container (Overlay over gameplay) -->
<div class="relative z-50 flex items-center justify-center min-h-screen p-4">
<!-- Main Settings Panel (Tier 3 Elevation: Surface Rail + Cyan Border + Glow) -->
<div class="w-full max-w-2xl bg-[#16161D]/90 backdrop-blur-xl border border-primary shadow-[0_0_15px_rgba(0,243,255,0.4)] flex flex-col relative">
<!-- Structural 'Active Rails' Decoration -->
<div class="absolute top-0 left-0 w-1 h-full bg-primary/50 shadow-[0_0_10px_rgba(0,243,255,0.5)]"></div>
<div class="absolute top-0 right-0 w-2 h-2 bg-primary"></div>
<div class="absolute bottom-0 left-0 w-full h-[1px] bg-primary/30"></div>
<!-- ID Tag (Top Left) -->
<div class="absolute -top-3 left-4 bg-background border border-primary px-2 py-1 flex items-center gap-2 z-10">
<div class="w-2 h-2 bg-primary animate-pulse"></div>
<span class="font-label-caps text-label-caps text-primary">SYS_CFG</span>
</div>
<!-- Header -->
<div class="px-8 py-6 border-b border-outline-variant/50 flex justify-between items-center mt-2">
<div>
<h1 class="font-headline-lg text-headline-lg text-on-surface uppercase tracking-widest">Settings</h1>
<p class="font-mono-data text-mono-data text-outline mt-1">CANARY_O1 // OVERRIDE PROTOCOL</p>
</div>
<button aria-label="Close Settings" class="text-outline hover:text-primary transition-colors flex items-center justify-center h-10 w-10 border border-transparent hover:border-primary bg-surface-dim hover:bg-surface">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
</div>
<!-- Content Body -->
<div class="p-8 flex flex-col gap-8">
<!-- Section: DIFFICULTY -->
<div class="flex flex-col gap-3">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-outline text-sm" style="font-variation-settings: 'FILL' 1;">tune</span>
<h2 class="font-label-caps text-label-caps text-outline uppercase tracking-wider">Difficulty</h2>
</div>
<div class="grid grid-cols-3 gap-2">
<!-- Option 1: Casual -->
<button class="group relative py-3 px-4 border border-outline-variant bg-surface-dim hover:bg-surface text-center transition-all">
<span class="font-label-caps text-label-caps text-on-surface-variant group-hover:text-on-surface">Casual</span>
</button>
<!-- Option 2: Standard (Selected) -->
<button class="group relative py-3 px-4 border border-primary bg-primary/10 text-center transition-all shadow-[inset_0_0_10px_rgba(0,243,255,0.2)]">
<span class="font-label-caps text-label-caps text-primary font-bold">Standard</span>
</button>
<!-- Option 3: Elite -->
<button class="group relative py-3 px-4 border border-outline-variant bg-surface-dim hover:bg-surface text-center transition-all">
<span class="font-label-caps text-label-caps text-on-surface-variant group-hover:text-on-surface">Elite</span>
<!-- Decor -->
<div class="absolute top-0 right-0 w-1 h-1 bg-error-container"></div>
</button>
</div>
</div>
<!-- Section: GAME SPEED -->
<div class="flex flex-col gap-3">
<div class="flex items-center justify-between">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-outline text-sm" style="font-variation-settings: 'FILL' 1;">speed</span>
<h2 class="font-label-caps text-label-caps text-outline uppercase tracking-wider">Game Speed</h2>
</div>
<span class="font-mono-data text-mono-data text-primary">1.0x</span>
</div>
<div class="relative w-full h-8 flex items-center">
<!-- Custom Range Input Wrapper -->
<input class="w-full h-1 bg-surface-variant appearance-none outline-none relative z-10" max="2.0" min="0.5" step="0.1" type="range" value="1.0"/>
<!-- Track Decoration -->
<div class="absolute left-0 top-1/2 -translate-y-1/2 w-1/3 h-1 bg-primary z-0 shadow-[0_0_8px_rgba(0,243,255,0.4)]"></div>
<!-- Markers -->
<div class="absolute w-full flex justify-between px-1 pointer-events-none z-0 mt-6">
<span class="font-mono-data text-[10px] text-outline">0.5</span>
<span class="font-mono-data text-[10px] text-outline">1.0</span>
<span class="font-mono-data text-[10px] text-outline">1.5</span>
<span class="font-mono-data text-[10px] text-outline">2.0</span>
</div>
</div>
<div class="h-4"></div> <!-- Spacer for markers -->
</div>
<!-- Section: INPUT HELP -->
<div class="flex flex-col gap-3">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-outline text-sm" style="font-variation-settings: 'FILL' 1;">keyboard</span>
<h2 class="font-label-caps text-label-caps text-outline uppercase tracking-wider">Input Help</h2>
</div>
<!-- Code/Terminal Style Box -->
<div class="bg-[#0A0A0F] border border-outline-variant/40 p-4 relative font-mono-data text-mono-data text-on-surface-variant flex flex-col gap-2">
<div class="absolute top-0 left-0 w-full h-[1px] bg-primary-fixed/20"></div>
<div class="flex justify-between items-center">
<span class="text-on-surface">Arrow Keys <span class="text-outline">or</span> WASD</span>
<span class="text-primary-fixed-dim">Flip Switches</span>
</div>
<div class="w-full h-[1px] bg-surface-variant/50 border-dashed border-b border-surface-variant"></div>
<div class="flex justify-between items-center">
<span class="text-on-surface">Space</span>
<span class="text-primary-fixed-dim">Pause</span>
</div>
</div>
</div>
</div>
<!-- Footer / Actions -->
<div class="p-6 bg-surface-dim/80 border-t border-outline-variant/30 flex justify-between items-center">
<!-- Reset (Ghost Button) -->
<button class="font-label-caps text-label-caps text-outline hover:text-on-surface hover:bg-surface-variant/30 px-4 py-2 transition-all">
                    Reset Preferences
                </button>
<div class="flex gap-4">
<!-- Secondary Button (Transparent, Magenta border) -->
<button class="bg-transparent border border-secondary-container text-secondary-container hover:bg-secondary-container/10 font-label-caps text-label-caps px-6 py-3 transition-all flex items-center gap-2">
<span>Back To Game</span>
</button>
<!-- Primary Button (Solid Cyan) -->
<button class="bg-primary text-[#050508] hover:shadow-[0_0_15px_rgba(0,243,255,0.6)] font-label-caps text-label-caps font-bold px-6 py-3 transition-all flex items-center gap-2 relative overflow-hidden group">
<span class="relative z-10">Save &amp; Return</span>
<div class="absolute inset-0 bg-white/20 translate-x-[-100%] group-hover:translate-x-[100%] transition-transform duration-500 ease-in-out z-0"></div>
</button>
</div>
</div>
</div>
</div>
</body></html>
